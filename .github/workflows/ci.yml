name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck / build
        run: npm run build
      - name: Smoke tests
        # Smoke has known weekday-dependent flaky checks (see CLAUDE.md). Fail only when a check
        # outside that list fails, or when smoke crashes without printing results.
        shell: bash
        run: |
          set +e
          npm run smoke 2>&1 | tee smoke.log
          known='^FAIL  (last week total|current week total|top channels last week|per-day counts)( |$)'
          unknown=$(grep '^FAIL ' smoke.log | grep -Ev "$known")
          if [ -n "$unknown" ]; then
            echo "::error::Unexpected smoke failures:"; echo "$unknown"; exit 1
          fi
          if ! grep -qE '^PASS ' smoke.log; then
            echo "::error::Smoke produced no results"; exit 1
          fi
          grep '^FAIL ' smoke.log | sed 's/^/::warning::known flaky: /'
          exit 0
